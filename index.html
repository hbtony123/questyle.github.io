<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questyle - 探索未知</title>
  <meta name="description" content="Questyle 创新空间 - 探索科技与人文的边界">
  <style>
    :root {
      --primary: #10b981;
      --secondary: #059669;
      --accent: #f59e0b;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.8);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }
    
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem;
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
    }
    
    .hero::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 50px,
          rgba(16, 185, 129, 0.03) 50px,
          rgba(16, 185, 129, 0.03) 51px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 50px,
          rgba(16, 185, 129, 0.03) 50px,
          rgba(16, 185, 129, 0.03) 51px
        );
      animation: gridMove 20s linear infinite;
    }
    
    @keyframes gridMove {
      from { transform: translate(0, 0); }
      to { transform: translate(50px, 50px); }
    }
    
    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 900px;
    }
    
    .hero h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 4s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    
    .hero p {
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.7;
    }
    
    .date-line {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 2rem;
      background: var(--card-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 50px;
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 3rem;
      backdrop-filter: blur(10px);
    }
    
    .quote-box {
      background: var(--card-bg);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 700px;
      margin: 0 auto 3rem;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    
    .quote-box::before {
      content: '"';
      position: absolute;
      top: -20px;
      left: 20px;
      font-size: 150px;
      color: rgba(16, 185, 129, 0.1);
      font-family: Georgia, serif;
      line-height: 1;
    }
    
    .quote-box blockquote {
      font-size: 1.4rem;
      font-style: italic;
      color: var(--text);
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }
    
    .quote-box cite {
      display: block;
      margin-top: 1.5rem;
      color: var(--accent);
      font-style: normal;
      font-size: 1rem;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      max-width: 800px;
      margin: 0 auto 3rem;
    }
    
    .stat-card {
      background: var(--card-bg);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    
    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      display: block;
    }
    
    .stat-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto 3rem;
      padding: 0 2rem;
    }
    
    .feature {
      background: var(--card-bg);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-radius: 16px;
      padding: 2rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .feature:hover {
      border-color: var(--primary);
      transform: translateY(-5px);
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.15);
    }
    
    .feature-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    
    .feature h3 {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 0.8rem;
    }
    
    .feature p {
      color: var(--muted);
      line-height: 1.6;
    }
    
    .footer {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--muted);
      border-top: 1px solid rgba(16, 185, 129, 0.1);
    }
    
    .footer a {
      color: var(--primary);
      text-decoration: none;
    }
    
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .quote-box blockquote { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-content">
      <h1>Questyle</h1>
      <p>探索科技与人文的边界<br>发现未知的可能性</p>
      
      <div class="date-line">
        <span>📅</span>
        <span id="currentDate"></span>
      </div>
      
      <div class="quote-box">
        <blockquote id="quoteText">加载中...</blockquote>
        <cite id="quoteAuthor"></cite>
      </div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-number" id="dayOfYear"></span>
          <span class="stat-label">今年的第几天</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="weekNumber"></span>
          <span class="stat-label">第几周</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="hoursLeft"></span>
          <span class="stat-label">距明天剩余小时</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="progressPercent"></span>
          <span class="stat-label">今年进度</span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="features">
    <div class="feature">
      <div class="feature-icon">🔬</div>
      <h3>前沿研究</h3>
      <p>探索最新的技术趋势，推动创新边界</p>
    </div>
    <div class="feature">
      <div class="feature-icon">💻</div>
      <h3>技术实践</h3>
      <p>将理论转化为实际解决方案，创造价值</p>
    </div>
    <div class="feature">
      <div class="feature-icon">🌐</div>
      <h3>全球视野</h3>
      <p>连接世界各地的创新者，共享知识与经验</p>
    </div>
  </div>
  
  <div class="footer">
    <p>&copy; 2026 创新空间. 保留所有权利.</p>
    <p style="margin-top: 1rem;">
      联系：<a href="mailto:hbtony@aliyun.com">hbtony@aliyun.com</a>
    </p>
    <p style="margin-top: 0.5rem; font-size: 0.85rem;">每日更新 · 持续探索 · 永不止步</p>
  </div>

  <script>
    const now = new Date();
    
    // 日期显示
    const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
    
    // 一年中的第几天
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    const dayOfYear = Math.floor(diff / oneDay);
    document.getElementById('dayOfYear').textContent = dayOfYear;
    
    // 周数
    const target = new Date(now.valueOf());
    const dayNr = (now.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = target.valueOf();
    target.setMonth(0, 1);
    if (target.getDay() !== 4) {
      target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
    }
    const weekNumber = 1 + Math.ceil((firstThursday - target) / (1000 * 60 * 60 * 24 * 7));
    document.getElementById('weekNumber').textContent = weekNumber;
    
    // 距明天剩余小时
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(0, 0, 0, 0);
    const hoursLeft = Math.ceil((tomorrow - now) / (1000 * 60 * 60));
    document.getElementById('hoursLeft').textContent = hoursLeft;
    
    // 今年进度
    const isLeap = (year) => (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    const daysInYear = isLeap(now.getFullYear()) ? 366 : 365;
    const progressPercent = ((dayOfYear / daysInYear) * 100).toFixed(1);
    document.getElementById('progressPercent').textContent = progressPercent + '%';
    
    // 每日语录
    const quotes = [
      { text: "探索未知是人类的本质，科技是我们最好的工具。", author: "未知" },
      { text: "真正的创新来自于对边界的挑战。", author: "史蒂夫·乔布斯" },
      { text: "未来已经到来，只是分布得不太均匀。", author: "威廉·吉布森" },
      { text: "最好的方式是预测未来的方式，就是创造它。", author: "彼得·德鲁克" },
      { text: "技术本身没有好坏，取决于使用它的人。", author: "比尔·盖茨" },
      { text: "好奇心是科学探索的最强动力。", author: "阿尔伯特·爱因斯坦" },
      { text: "在变化中寻找机会，在挑战中发现可能。", author: "未知" }
    ];
    
    const today = now.getDate();
    const quote = quotes[today % quotes.length];
    document.getElementById('quoteText').textContent = quote.text;
    document.getElementById('quoteAuthor').textContent = `— ${quote.author}`;
  </script>
</body>
</html>
