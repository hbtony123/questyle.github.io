<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questyle - 自然灵感</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #e6f7f0 0%, #f0f7f0 100%);
      color: #333;
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.6;
      padding: 3rem;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 {
      font-size: 3.5rem;
      text-align: center;
      margin: 2rem 0;
      background: linear-gradient(45deg, #4a9f8a, #6ab5a0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      font-size: 1.8rem;
      text-align: center;
      opacity: 0.8;
      margin-bottom: 3rem;
    }
    .content {
      background: white;
      border-radius: 20px;
      padding: 3rem;
      margin-bottom: 4rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }
    .content::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 300%;
      height: 300%;
      background: radial-gradient(circle, rgba(74,159,138,0.1) 0%, transparent 70%);
      transform: rotate(30deg);
    }
    .highlight {
      background: #e6f7f0;
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      margin: 2.5rem 0;
      transition: all 0.3s ease;
    }
    .highlight:hover {
      transform: scale(1.02);
      background: #d4f0e6;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }
    .quote {
      font-style: italic;
      font-size: 1.4rem;
      text-align: center;
      margin: 2rem 0;
      position: relative;
    }
    .water-drop {
      position: absolute;
      border-radius: 50%;
      background: rgba(74,159,138,0.2);
      opacity: 0;
      transition: all 0.5s ease;
    }
    .footer {
      text-align: center;
      opacity: 0.7;
      padding-top: 3rem;
      border-top: 1px solid #e0e0e0;
    }
    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      .subtitle { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Questyle</h1>
    <div class="subtitle">自然灵感的创意空间</div>

    <div class="content">
      <p>让灵感如溪流般自然涌现。Questyle 为创意工作者提供纯净、专注的数字环境，激发无限可能。</p>
      
      <div class="highlight">
        <p>"当技术融入自然，创意便如泉水般涌流"</p>
      </div>

      <div class="quote">
        <p>在数字与自然的交汇处，发现真正的创造力</p>
      </div>
    </div>

    <div class="footer">
      © 2026 Questyle.io · 保持自然 · 保持创意
    </div>
  </div>

  <script>
    // 水滴微动效
    document.addEventListener('DOMContentLoaded', () => {
      const highlight = document.querySelector('.highlight');
      highlight.addEventListener('mouseenter', (e) => {
        const rect = highlight.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const drop = document.createElement('div');
        drop.className = 'water-drop';
        drop.style.width = '40px';
        drop.style.height = '40px';
        drop.style.left = `${x - 20}px`;
        drop.style.top = `${y - 20}px`;
        highlight.appendChild(drop);
        
        setTimeout(() => {
          drop.style.width = '80px';
          drop.style.height = '80px';
          drop.style.opacity = 0;
        }, 10);
        
        setTimeout(() => {
          drop.remove();
        }, 500);
      });
    });
  </script>
</body>
</html>
